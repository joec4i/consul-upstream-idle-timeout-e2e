# A Consul dev agent, two services with Envoy sidecars, and a NAT container in
# front of the sites sidecar. run.sh drives it; see the README.
#
#   caller-proxy -> nat:21000 -> (DNAT, masquerade) -> sites-proxy:21000 -> sites
#
# Each proxy shares its app's network namespace, as a sidecar does, and runs one
# worker so the caller keeps a single pooled connection.
name: consul-idle-timeout-e2e

x-envoy: &envoy
  image: consul-idle-timeout-e2e/envoy
  init: true

services:
  consul:
    image: ${CONSUL_IMAGE}
    command: ["agent", "-dev", "-client=0.0.0.0", "-log-level=warn"]

  nat:
    build: nat
    image: consul-idle-timeout-e2e/nat
    # To set sysctls and iptables rules in its own network namespace.
    privileged: true
    init: true
    environment:
      CONNTRACK_S: ${CONNTRACK_S:-}
    depends_on: [sites]

  sites:
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /www && echo ok > /www/index.html && exec httpd -f -p 8080 -h /www"]

  sites-proxy:
    <<: *envoy
    build:
      context: envoy
      args:
        CONSUL_IMAGE: ${CONSUL_IMAGE:?set CONSUL_IMAGE, or use run.sh}
        ENVOY_IMAGE: ${ENVOY_IMAGE:-envoyproxy/envoy:v1.38.7}
    command: ["sites", "--concurrency", "1", "--drain-time-s", "${DRAIN_S:-30}"]
    network_mode: service:sites
    depends_on: [consul, sites]

  # Does nothing itself. run.sh runs wget and netstat in here.
  caller:
    image: busybox:1.36
    command: ["sleep", "1000000"]
    init: true

  caller-proxy:
    <<: *envoy
    # The image sites-proxy builds. Building it twice in parallel races on the tag.
    pull_policy: never
    command: ["caller", "--concurrency", "1"]
    network_mode: service:caller
    depends_on: [consul, caller]
